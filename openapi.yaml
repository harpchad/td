openapi: 3.0.3
info:
  title: td API
  version: 1.0.0
  description: >-
    Single-user task manager. One transport: the TUI, the web UI, the MCP
    server, and the sync plugins all exercise these routes, so a bug shows up
    everywhere at once instead of hiding in the path you use least.

    Every route but the health check and the login pair requires a credential:
    a session cookie from POST /login, or a `td_` bearer token in the
    Authorization header. A token never travels in a query string. An
    unauthenticated request to /api/v1/* answers 401 with an empty body.

    There is no registration route and no password reset route. The one
    account is created by `tdd account create` on the server. Until it exists
    every route answers 503.

servers:
  - url: http://127.0.0.1:8080
    description: local development

security:
  - bearerToken: []
  - sessionCookie: []

tags:
  - name: auth
  - name: tasks
  - name: people
  - name: filters
  - name: history
  - name: tokens
  - name: mcp
  - name: oauth
  - name: sync
  - name: attachments
  - name: series

paths:
  /healthz:
    get:
      summary: Liveness
      description: Unauthenticated, with no detail in the body.
      operationId: health
      responses:
        "200":
          description: serving
          content:
            text/plain:
              schema:
                type: string

  /.well-known/oauth-protected-resource:
    get:
      tags: [mcp]
      summary: Protected Resource Metadata
      description: >-
        RFC 9728, mandatory for an MCP resource server as of the 2026-07-28
        revision. Unauthenticated on purpose: a client reads it precisely
        because it has no credential yet. The `resource` value must match the
        MCP URL exactly, because it is what an access token's audience is
        checked against.

        One deployment note, because it fails in a way that looks like an
        application bug: the reverse proxy must pass /.well-known/* through.
        A rule broad enough to swallow everything under /.well-known/ while
        intercepting acme-challenge breaks discovery entirely.
      operationId: protectedResourceMetadata
      responses:
        "200":
          description: the metadata document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResourceMetadata" }

  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      summary: Authorization Server Metadata
      description: >-
        RFC 8414. td is its own OAuth 2.1 authorization server because
        claude.ai's custom connector UI takes a client id and secret and has
        no field for a bearer token, so a static token cannot be used there at
        all. There is one user and no external IdP, so /authorize reuses the
        password and TOTP login that already exists.

        `client_credentials` is deliberately absent from
        `grant_types_supported`: every token this server issues acts as the
        one account holder, and that needs a person in the loop.
      operationId: authorizationServerMetadata
      responses:
        "200":
          description: the metadata document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationServerMetadata" }

  /.well-known/jwks.json:
    get:
      tags: [oauth]
      summary: JSON Web Key Set
      description: >-
        The public halves of the live signing keys. Two are kept live at once
        so a rotation does not invalidate every session: the newest signs, and
        both verify until the older leaves the set.
      operationId: jwks
      responses:
        "200":
          description: the key set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JWKS" }

  /authorize:
    get:
      tags: [oauth]
      summary: Authorization endpoint
      description: >-
        Authorization code with PKCE. S256 only: OAuth 2.1 removes `plain`,
        and `plain` is not weak arithmetic, it is no arithmetic. A missing
        `code_challenge_method` is refused rather than defaulting to `plain`,
        which is what RFC 7636 says the default is.

        `resource` is required (RFC 8707) and must equal the MCP URL exactly;
        the access token's audience is that value. The response carries `iss`
        (RFC 9207) on both the success and the error path, so a client talking
        to two authorization servers can tell which one answered.

        An unregistered `client_id` or `redirect_uri` renders an error page
        rather than redirecting: sending a code, or even an error, to a URI
        nobody validated is how an authorization code ends up somewhere else.
        Every other failure goes back through the redirect as query
        parameters.
      operationId: authorize
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: scope, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: resource, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [S256] }
      responses:
        "200":
          description: the consent screen
          content:
            text/html:
              schema: { type: string }
        "303":
          description: >-
            back to the client's redirect_uri, carrying either code and state
            or error and error_description, plus iss either way
        "400":
          description: >-
            the client id or redirect_uri is not registered, so nothing is
            redirected anywhere

  /token:
    post:
      tags: [oauth]
      summary: Token endpoint
      description: >-
        Exchanges an authorization code or a refresh token. Refresh tokens are
        rotated on every use, so a stolen one is usable at most once and the
        theft surfaces as the real client suddenly failing. A refresh may
        narrow the granted scopes and never widen them.

        `client_credentials` is refused by name rather than lumped in with the
        unknown grants, because a client that tries it should be told this is
        a decision.
      operationId: token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string }
                refresh_token: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                scope: { type: string }
                resource: { type: string }
      responses:
        "200":
          description: the token, with Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: the grant is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: client authentication failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }

  /register:
    post:
      tags: [oauth]
      summary: Dynamic Client Registration
      description: >-
        RFC 7591, deprecated by the 2026-07-28 MCP revision in favour of
        Client ID Metadata Documents and kept because some clients speak
        nothing else.

        This is not user registration. It creates no account and grants no
        access: a registered client still has to send its user through
        /authorize, where the one account holder decides. A client that says
        `token_endpoint_auth_method: none` gets no secret and relies on PKCE
        alone, which is what OAuth 2.1 expects of anything that cannot keep
        one.
      operationId: registerClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientRegistration" }
      responses:
        "201":
          description: the registered client. The secret appears exactly once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientRegistrationResponse" }
        "400":
          description: the metadata or a redirect_uri is not acceptable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }

  /revoke:
    post:
      tags: [oauth]
      summary: Revocation endpoint
      description: >-
        RFC 7009. Answers 200 whether or not the token existed: reporting the
        difference would turn this into an oracle for guessing tokens.
      operationId: revokeOAuthToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string }
      responses:
        "200":
          description: revoked, or the token did not exist

  /mcp:
    post:
      tags: [mcp]
      summary: Model Context Protocol
      description: >-
        JSON-RPC over HTTP, revision 2026-07-28. That revision removed sessions
        and the initialize/initialized handshake, so the protocol is stateless
        request/response and POST is the only method; GET and DELETE were the
        session transport. An unauthenticated request answers 401 with
        `WWW-Authenticate: Bearer resource_metadata="...", scope="td:read"`,
        which is the whole of client discovery. A valid credential missing a
        scope answers 403 with `error="insufficient_scope"`.

        Read is the floor for reaching the protocol; each tool checks the scope
        it needs, so a client can list the tools and be told which ones it may
        use rather than seeing nothing.
      operationId: mcp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request.
      responses:
        "200":
          description: the JSON-RPC response
          content:
            application/json:
              schema:
                type: object
        "401":
          description: >-
            no valid credential. The body is empty; the WWW-Authenticate
            header carries the discovery chain.
        "403":
          description: the credential is valid but lacks the scope

  /login:
    post:
      tags: [auth]
      summary: Log in
      description: >-
        Password plus either the authenticator code or a recovery code. A
        recovery code works exactly once. Every failure answers the same
        status and the same body, whether the username exists or not, and
        takes the same time. Failures against the password and against the
        second factor are counted separately; five of either locks the account
        for fifteen minutes. Limited to ten attempts per IP per minute.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: logged in, with the session cookie set
          headers:
            Set-Cookie:
              description: "td_session, HttpOnly, Secure, SameSite=Lax"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401":
          description: that combination did not work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: too many attempts from this address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/NoAccount"

  /logout:
    post:
      tags: [auth]
      summary: End the session
      operationId: logout
      security: []
      responses:
        "204":
          description: the session is gone and the cookie is cleared

  /api/v1/whoami:
    get:
      tags: [auth]
      summary: Report the calling principal
      description: Which credential is in use, what it may do, and what it writes to the event log.
      operationId: whoami
      responses:
        "200":
          description: the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/tokens:
    get:
      tags: [tokens]
      summary: List API tokens
      description: Secrets are never returned here. Only the display prefix.
      operationId: listTokens
      responses:
        "200":
          description: every token, revoked ones included
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [tokens]
      summary: Mint an API token
      description: >-
        The response carries the secret. It is the only time it exists outside
        the caller, because only its hash is stored.
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: the token, with its secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [tokens]
      summary: Revoke a token
      description: The row stays, so the settings page can still show that it existed.
      operationId: revokeToken
      responses:
        "204":
          description: revoked
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: List tasks
      operationId: listTasks
      parameters:
        - name: q
          in: query
          description: A filter in the grammar from BUILD-SPEC.md section 6.
          schema: { type: string }
        - name: limit
          in: query
          description: >-
            Truncate to the top N of the order. This is not pagination: there
            is no continuation token, and total still reports the untruncated
            count.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: matching tasks in the default order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [tasks]
      summary: Create a task
      description: >-
        The id is client-supplied, which makes this idempotent: a retrying
        plugin cannot duplicate a row.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201":
          description: created, or the existing task when the id was already known
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: A ULID or the short task number.
        schema: { type: string }
    get:
      tags: [tasks]
      summary: Get one task
      operationId: getTask
      responses:
        "200":
          description: the task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [tasks]
      summary: Update a task
      description: >-
        An absent key leaves a field alone; a key present with a null clears
        it. If-Match is compared against updated_at so a slow client cannot
        clobber a newer edit.
      operationId: patchTask
      parameters:
        - name: If-Match
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskPatch" }
      responses:
        "200":
          description: the updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [tasks]
      summary: Drop a task
      description: Sets status to dropped. There is no hard delete anywhere in td.
      operationId: dropTask
      responses:
        "200":
          description: the dropped task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/tasks/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [tasks]
      summary: Complete a task
      description: >-
        Reports how many children are still open so the client can prompt. The
        server never cascades on its own.
      operationId: completeTask
      responses:
        "200":
          description: the completed task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompleteResult" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/tasks/{id}/snooze:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [tasks]
      summary: Snooze a task
      description: >-
        Hides the task until an instant. Does not change its status, and is
        refused on a done or dropped task. Takes a relative duration as well
        as an absolute time because the ntfy action button is composed when
        the reminder is sent and clicked later, so "1h" has to mean an hour
        from the tap.
      operationId: snoozeTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnoozeRequest" }
      responses:
        "200":
          description: the snoozed task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/tasks/{id}/attachments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [attachments]
      summary: List a task's attachments
      operationId: listAttachments
      responses:
        "200":
          description: the files on the task
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Attachment" }
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [attachments]
      summary: Attach a file
      description: >-
        The request body is the file itself rather than a multipart form:
        there is one field, and the filename rides in X-Td-Filename. Content
        is addressed by SHA-256, so the same file on four tasks is four rows
        and one file on disk. The cap is 25 MB and is enforced while
        streaming, not from Content-Length.
      operationId: addAttachment
      parameters:
        - name: X-Td-Filename
          in: header
          required: false
          description: the name to show and to send back on download
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: the stored attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: the file is larger than 25 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/tasks/{id}/attachments/{att}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: att
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [attachments]
      summary: Download an attachment
      description: >-
        Served through the same authentication as every other route. There is
        no static handler over the blob directory, because a guessable path
        under one is a download that skipped the auth check. The response is
        always Content-Disposition: attachment.
      operationId: getAttachment
      responses:
        "200":
          description: the file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [attachments]
      summary: Detach a file
      description: >-
        Removes the row. The bytes stay until the weekly sweep, since another
        task may point at the same blob.
      operationId: deleteAttachment
      responses:
        "204":
          description: detached
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/series:
    post:
      tags: [series]
      summary: Create a recurring series
      description: >-
        Stores an RFC 5545 rule plus the template its instances are made from,
        and materialises the first instance. Exactly one open instance exists
        at a time; generating a year up front makes every query slower and
        every edit ambiguous.
      operationId: createSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Series" }
      responses:
        "201":
          description: the series and its first instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/series/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [series]
      summary: Get a series
      operationId: getSeries
      responses:
        "200":
          description: the series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [series]
      summary: Edit a series
      description: >-
        The explicit series edit. Editing an instance edits that instance;
        this is the separate action that changes the rule and the template,
        and it never rewrites an instance already in the list.
      operationId: updateSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Series" }
      responses:
        "200":
          description: the updated series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/export:
    get:
      tags: [history]
      summary: The whole database
      description: >-
        Everything td holds, in a form that goes back in through /import. A
        task system you cannot get your data out of is a hostage situation,
        and getting it out is only half of that: the round trip is what makes
        this a backup rather than a report.

        Deliberately absent: fold state, which is view state and must never be
        exported; and every credential, so a file copied to object storage
        cannot log anybody in. Accounts, sessions, tokens, OAuth clients,
        grants, and signing keys are all excluded.
      operationId: exportAll
      responses:
        "200":
          description: the export document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }

  /api/v1/import:
    post:
      tags: [history]
      summary: Restore an export
      description: >-
        Restores into an empty database and refuses one that already holds
        tasks: merging two task sets means deciding what a colliding number
        means, and there is no answer to that which is not somebody's data
        quietly disappearing.

        Sequence numbers, timestamps, and the event log are preserved rather
        than regenerated, because undo walks backwards through the log and the
        MCP change cursor points into it.
      operationId: importAll
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Export" }
      responses:
        "200":
          description: what was restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: integer }
                  people: { type: integer }
                  events: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: the database is not empty

  /api/v1/sync/{source}:
    post:
      tags: [sync]
      summary: Apply a sync plugin batch
      description: >-
        Upserts by (source, external_id), applies the field-ownership rules,
        and marks `gone` items `upstream_gone = 1` rather than deleting them.
        Idempotent, so a plugin can always replay: an item whose `rev` matches
        what is stored is left completely alone, with no write and no event.

        **Field ownership is the core rule.** Upstream owns title, status,
        due_at, and the external URL and revision. Locally owned and never
        touched: priority, notes, tags, person links, snooze, start, notify,
        effort, and parent. "My priority got wiped by a sync" kills trust in
        one incident, so the division is enforced here rather than left to
        each plugin.

        One exception runs the other way: a task you completed or dropped in
        td keeps that status whatever the upstream item says. Completing a
        mirrored task is a statement about your own work.

        Requires the `sync:<source>` scope, so a token minted for one plugin
        cannot write another's mirror and reaches nothing else in the API.
      operationId: syncSource
      parameters:
        - name: source
          in: path
          required: true
          description: The plugin's name, which becomes task.source. Never "local".
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
      responses:
        "200":
          description: what the batch did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: the token does not carry this source's sync scope

  /api/v1/people:
    get:
      tags: [people]
      summary: List people
      operationId: listPeople
      responses:
        "200":
          description: everyone tasks can refer to
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Person" }
    post:
      tags: [people]
      summary: Add a person
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Person" }
      responses:
        "201":
          description: the person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/people/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: an id or a handle
        schema: { type: string }
    get:
      tags: [people]
      summary: Get one person
      operationId: getPerson
      responses:
        "200":
          description: the person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [people]
      summary: Update a person
      description: The handle is not editable; saved filters refer to it.
      operationId: updatePerson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Person" }
      responses:
        "200":
          description: the person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/people/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [people]
      summary: The person page
      description: >-
        A first-class screen rather than a filter preset. The sections come in
        the order section 5 fixes: assigned to them, what you owe them, what
        you are waiting on with its age, involved, the agenda, then their
        groups' tasks.
      operationId: personTasks
      responses:
        "200":
          description: the page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonPage" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/people/{id}/identities:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [people]
      summary: Map an external account onto a person
      description: >-
        A Jira account id, a monday user id, and an Entra object id all
        resolve to one person row, so a query spans systems instead of finding
        three of the same person.
      operationId: linkIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Identity" }
      responses:
        "200":
          description: the person's identities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Identity" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/groups:
    get:
      tags: [people]
      summary: List groups
      description: Static membership, not saved searches.
      operationId: listGroups
      responses:
        "200":
          description: the groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      tags: [people]
      summary: Add a group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
      responses:
        "201":
          description: the group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/groups/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [people]
      summary: Replace a group's membership
      operationId: setGroupMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  items: { type: string }
      responses:
        "204":
          description: done
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/tasks/{id}/people:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [people]
      summary: Link a person to a task
      operationId: linkPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person, role]
              properties:
                person: { type: string, description: "an id or a handle" }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: the task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks/{id}/people/{person}/{role}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: person
        in: path
        required: true
        schema: { type: string }
      - name: role
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Role" }
    delete:
      tags: [people]
      summary: Remove one person link
      operationId: unlinkPerson
      responses:
        "200":
          description: the task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/filters:
    get:
      tags: [filters]
      summary: List saved filters
      operationId: listFilters
      responses:
        "200":
          description: filters bound to the number keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedFilter" }
    post:
      tags: [filters]
      summary: Bind a filter to a slot
      operationId: putFilter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedFilter" }
      responses:
        "201":
          description: the saved filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedFilter" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/ui/folds:
    get:
      tags: [tasks]
      summary: Which parents are folded
      description: >-
        View state, stored server-side so it follows you between clients. It
        is deliberately not a field on Task: section 3 requires that it never
        be exported, never synced, and never an event.
      operationId: listFolds
      responses:
        "200":
          description: the folded parents
          content:
            application/json:
              schema:
                type: object
                required: [collapsed]
                properties:
                  collapsed:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/ui/folds/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [tasks]
      summary: Fold or unfold one parent
      operationId: setFold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collapsed]
              properties:
                collapsed: { type: boolean }
      responses:
        "204":
          description: done
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/events:
    get:
      tags: [history]
      summary: Change feed
      description: >-
        The append-only history. MCP clients poll this instead of re-listing
        everything.
      operationId: listEvents
      parameters:
        - name: since
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: events, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/undo:
    post:
      tags: [history]
      summary: Reverse the caller's newest reversible change
      description: >-
        Unbounded depth, walking the event log backwards over the calling
        actor's own events. Writes its own event naming the seq it reversed.
      operationId: undo
      responses:
        "200":
          description: what was reversed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UndoResult" }
        "404":
          description: nothing left to undo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: >-
        A `td_` token in the Authorization header. Never in a query string:
        any request carrying one there is refused.
    sessionCookie:
      type: apiKey
      in: cookie
      name: td_session
      description: Issued by POST /login. HttpOnly, Secure, SameSite=Lax.

  responses:
    Unauthenticated:
      description: >-
        No valid credential. The body is empty: nothing distinguishes a bad
        token from a missing one.
    NoAccount:
      description: no account has been created yet
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: the request could not be read
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: no task with that id or number
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: an illegal status transition, or a stale If-Match
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: the request was understood and a precondition was not met
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        totp:
          type: string
          description: the six digit authenticator code
        recovery_code:
          type: string
          description: substitutes for totp, and works exactly once

    SessionInfo:
      type: object
      required: [scopes, actor, kind]
      properties:
        username: { type: string }
        scopes:
          type: array
          items: { type: string }
        actor:
          type: string
          description: "what a mutation writes to the event log: me, mcp:<name>, or plugin:<source>"
        expires_at: { type: string }
        kind:
          type: string
          enum: [session, token]

    Token:
      type: object
      required: [id, name, prefix, scopes, actor, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix:
          type: string
          description: the leading fragment, so two tokens can be told apart
        scopes:
          type: array
          items: { type: string }
        actor: { type: string }
        created_at: { type: string }
        last_used_at: { type: string, nullable: true }
        revoked_at: { type: string, nullable: true }
        secret:
          type: string
          description: present only in the response that creates the token

    TokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        actor:
          type: string
          default: me
          description: "me, mcp:<name>, or plugin:<source>"
        scopes:
          type: array
          items:
            type: string
            description: "read, write, capture, or sync:<source>"

    Status:
      type: string
      enum: [inbox, todo, doing, waiting, done, dropped]

    Notify:
      type: string
      enum: [auto, on, off]

    Role:
      type: string
      enum: [assigner, assignee, involved, waiting]

    AuthorizationServerMetadata:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri]
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        registration_endpoint: { type: string }
        revocation_endpoint: { type: string }
        jwks_uri: { type: string }
        scopes_supported:
          type: array
          items: { type: string, enum: [td:read, td:capture, td:write] }
        grant_types_supported:
          type: array
          description: >-
            authorization_code and refresh_token. client_credentials is not
            supported and is deliberately absent.
          items: { type: string }
        response_types_supported:
          type: array
          items: { type: string }
        code_challenge_methods_supported:
          type: array
          description: S256 only. plain is not weak arithmetic, it is no arithmetic.
          items: { type: string, enum: [S256] }
        token_endpoint_auth_methods_supported:
          type: array
          items: { type: string }
        resource_indicators_supported: { type: boolean }
        authorization_response_iss_parameter_supported: { type: boolean }
        client_id_metadata_document_supported: { type: boolean }

    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, kid, alg, use, x, y]
            properties:
              kty: { type: string, enum: [EC] }
              crv: { type: string, enum: [P-256] }
              kid: { type: string }
              alg: { type: string, enum: [ES256] }
              use: { type: string, enum: [sig] }
              x: { type: string }
              y: { type: string }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: >-
            An ES256 JWT whose aud is the resource exactly. The audience is
            compared as an exact string, never a prefix and never a contains:
            that is what stops a token minted for another server from being
            replayed here.
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        refresh_token: { type: string }
        scope: { type: string }

    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }

    ClientRegistration:
      type: object
      required: [redirect_uris]
      properties:
        client_name: { type: string }
        redirect_uris:
          type: array
          description: >-
            https, or http on loopback. Matched exactly at /authorize: a
            prefix or hostname match is how open redirectors happen.
          items: { type: string }
        scope: { type: string }
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        token_endpoint_auth_method:
          type: string
          description: none makes this a public client, which relies on PKCE alone.

    ClientRegistrationResponse:
      type: object
      required: [client_id, client_name, redirect_uris, scope]
      properties:
        client_id: { type: string }
        client_secret:
          type: string
          description: Absent for a public client. Shown exactly once.
        client_name: { type: string }
        redirect_uris:
          type: array
          items: { type: string }
        scope: { type: string }

    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers, scopes_supported, bearer_methods_supported]
      properties:
        resource:
          type: string
          description: Exactly the MCP URL. Token audiences are compared against it.
          example: https://td.example.com/mcp
        authorization_servers:
          type: array
          items: { type: string }
        scopes_supported:
          type: array
          items:
            type: string
            enum: [td:read, td:capture, td:write]
        bearer_methods_supported:
          type: array
          description: >-
            header only. No endpoint in td accepts a token in a query string:
            it ends up in access logs, browser history, and Referer headers.
          items: { type: string, enum: [header] }
        resource_name: { type: string }
        resource_documentation: { type: string }

    Export:
      type: object
      required: [version, exported_at, timezone, tasks]
      properties:
        version:
          type: integer
          description: >-
            Checked on import. A backup that silently half-restores is worse
            than one that refuses.
        exported_at: { type: string, format: date-time }
        timezone: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        people:
          type: array
          items: { $ref: "#/components/schemas/Person" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/Group" }
        identities:
          type: array
          items: { $ref: "#/components/schemas/Identity" }
        filters:
          type: array
          items: { $ref: "#/components/schemas/SavedFilter" }
        series:
          type: array
          items: { $ref: "#/components/schemas/Series" }
        attachments:
          type: array
          description: >-
            The rows, not the bytes. The blobs are files on disk and are
            backed up as files.
          items: { $ref: "#/components/schemas/Attachment" }
        events:
          type: array
          description: >-
            The history, with its sequence numbers preserved. It is what makes
            an export a record rather than a snapshot.
          items: { $ref: "#/components/schemas/Event" }

    SyncRequest:
      type: object
      required: [items]
      properties:
        cursor:
          type: string
          description: >-
            Where the plugin resumed from. Echoed back; what it means is the
            plugin's business.
        items:
          type: array
          items: { $ref: "#/components/schemas/SyncItem" }
        gone:
          type: array
          description: >-
            External ids that disappeared upstream. Marked, never deleted: a
            ticket you can no longer see is not a ticket that never existed.
          items: { type: string }

    SyncItem:
      type: object
      required: [external_id, title]
      description: >-
        Every optional field is omitted rather than zeroed when the plugin
        cannot see it. A partial reader that sent empty values would blank the
        mirror on its first run.
      properties:
        external_id: { type: string }
        title: { type: string }
        status:
          type: string
          description: >-
            Already mapped onto td's vocabulary by the plugin, because only
            the plugin knows what its system's states mean. Anything outside
            the closed set is ignored rather than stored.
          enum: [inbox, todo, doing, waiting, done, dropped]
        url: { type: string }
        rev:
          type: string
          description: >-
            The upstream revision or ETag. An item whose rev has not moved is
            left untouched, which is what makes a replay free.
        due_at: { type: string, nullable: true }
        people:
          type: array
          items:
            type: object
            required: [role, source_user]
            properties:
              role: { $ref: "#/components/schemas/Role" }
              source_user:
                type: string
                description: >-
                  The identifier in the source system, resolved onto a person
                  through person_identity. Not an email and not a display
                  name, both of which change.
              name:
                type: string
                description: >-
                  Used to create the person the first time an identity is
                  seen. Without it an unknown identity is skipped and the task
                  still arrives.

    SyncResult:
      type: object
      required: [cursor, created, updated, gone, unchanged]
      properties:
        cursor: { type: string }
        created: { type: integer }
        updated: { type: integer }
        gone: { type: integer }
        unchanged:
          type: integer
          description: >-
            Items whose rev matched. A plugin replaying its window should see
            mostly this, which is how idempotence is visible rather than
            merely claimed.

    Attachment:
      type: object
      required: [id, task_id, sha256, filename, bytes, mime, created_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        sha256:
          type: string
          description: >-
            The blob's address, not a checksum for verification. Two rows with
            the same digest are one file on disk.
          pattern: "^[0-9a-f]{64}$"
        filename: { type: string }
        bytes: { type: integer, format: int64 }
        mime: { type: string }
        created_at: { type: string, format: date-time }

    Series:
      type: object
      required: [rrule]
      properties:
        id: { type: string }
        rrule:
          type: string
          description: "An RFC 5545 RRULE, with or without the RRULE: prefix."
          example: "FREQ=WEEKLY;BYDAY=MO"
        mode:
          type: string
          enum: [fixed, after_completion]
          default: fixed
          description: >-
            fixed takes the next occurrence from the rule regardless of when
            the last one was completed. after_completion takes completion time
            plus the rule's interval, so completing early pulls the whole
            series earlier.
        catchup:
          type: string
          enum: [skip, pile]
          default: skip
          description: >-
            What happens to occurrences that passed while an instance sat
            open. skip logs each as a recurrence.missed event and leaves the
            one open instance alone; pile creates the backlog.
        anchor:
          type: string
          enum: [due, start]
          default: due
        tz:
          type: string
          description: IANA zone the rule's wall clock is read in.
          example: America/Chicago
        template: { $ref: "#/components/schemas/TaskCreate" }
        next_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        last_fired_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Where the catch-up walk starts. Without it a restart cannot tell a
            missed occurrence from one that never came due.
        current_task_id:
          type: string
          nullable: true

    SeriesResponse:
      type: object
      required: [series]
      properties:
        series: { $ref: "#/components/schemas/Series" }
        task:
          allOf:
            - $ref: "#/components/schemas/Task"
          description: >-
            On creation, the instance that was materialised. Saves a second
            request to find out what appeared in the list.

    Task:
      type: object
      required:
        - id
        - num
        - title
        - notes
        - status
        - due_is_date
        - notify
        - source
        - upstream_gone
        - created_at
        - updated_at
        - tags
        - people
        - groups
        - attachments
        - children_total
        - children_done
      properties:
        id: { type: string, description: "ULID, generated by the client" }
        num: { type: integer, format: int64, description: "short human id" }
        title: { type: string }
        notes: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        priority:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          description: "1 is highest; null is unset and never matches a p: comparison"
        due_at:
          type: string
          nullable: true
          description: RFC3339 instant, or YYYY-MM-DD when due_is_date is true
        due_is_date:
          type: boolean
          description: >-
            A date-only due is a calendar date with no zone. Treating it as an
            instant breaks the moment you travel.
        start_at: { type: string, nullable: true }
        snooze_until: { type: string, nullable: true }
        notify: { $ref: "#/components/schemas/Notify" }
        remind_before: { type: integer, nullable: true }
        notified_at: { type: string, nullable: true }
        waiting_on: { type: string, nullable: true }
        waiting_since: { type: string, nullable: true }
        effort: { type: integer, nullable: true }
        parent_id: { type: string, nullable: true }
        series_id: { type: string, nullable: true }
        source: { type: string }
        external_id: { type: string, nullable: true }
        external_url: { type: string, nullable: true }
        external_rev: { type: string, nullable: true }
        upstream_gone: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
        completed_at: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        people:
          type: array
          items: { $ref: "#/components/schemas/TaskPerson" }
        groups:
          type: array
          items: { type: string }
        attachments: { type: integer }
        children_total: { type: integer }
        children_done: { type: integer }

    TaskPerson:
      type: object
      required: [person_id, name, role]
      properties:
        person_id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    TaskCreate:
      type: object
      required: [title]
      properties:
        id: { type: string }
        title: { type: string }
        notes: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        priority: { type: integer, minimum: 1, maximum: 4 }
        due_at: { type: string }
        start_at: { type: string }
        notify: { $ref: "#/components/schemas/Notify" }
        effort: { type: integer }
        parent_id: { type: string }
        tags:
          type: array
          items: { type: string }
        people:
          type: array
          items: { type: string, description: "handle, optionally handle:role" }
        waiting_on: { type: string }
        source: { type: string }
        external_id: { type: string }
        external_url: { type: string }

    TaskPatch:
      type: object
      description: >-
        An absent key leaves the field alone. A key present with a null clears
        it.
      properties:
        title: { type: string }
        notes: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        priority: { type: integer, minimum: 1, maximum: 4, nullable: true }
        due_at: { type: string, nullable: true }
        start_at: { type: string, nullable: true }
        snooze_until: { type: string, nullable: true }
        notify: { $ref: "#/components/schemas/Notify" }
        effort: { type: integer, nullable: true }
        waiting_on: { type: string, nullable: true }
        tags:
          type: array
          nullable: true
          items: { type: string }

    SnoozeRequest:
      type: object
      description: One of duration or until.
      properties:
        duration:
          type: string
          description: "relative, as 1h or 30m"
        until:
          type: string
          description: an RFC3339 instant

    TaskList:
      type: object
      required: [tasks, total]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        total:
          type: integer
          description: >-
            How many tasks matched, before any limit was applied.

    CompleteResult:
      type: object
      required: [task, children_open]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        children_open:
          type: integer
          description: >-
            How many children are still open. The client prompts; the server
            never cascades.

    Person:
      type: object
      required: [id, name, handle]
      properties:
        id: { type: string }
        name: { type: string }
        handle: { type: string, description: "the @handle the filter grammar matches" }
        email: { type: string }
        notes: { type: string }

    Group:
      type: object
      required: [handle, name]
      description: Static membership, not a saved search. Kept dumb on purpose.
      properties:
        id: { type: string }
        handle: { type: string, description: "what grp: matches" }
        name: { type: string }
        members:
          type: array
          description: person ids
          items: { type: string }

    Identity:
      type: object
      required: [source, external_id]
      properties:
        person_id: { type: string }
        source: { type: string }
        external_id: { type: string }

    PersonPage:
      type: object
      required: [person]
      description: >-
        The sections are ordered, and the order is the point: what they owe
        you, what you owe them, what you are waiting on and for how long, then
        the softer links.
      properties:
        person: { $ref: "#/components/schemas/Person" }
        assigned:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        owed:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        waiting:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        waiting_days:
          type: array
          description: parallel to waiting, in whole days
          items: { type: integer }
        involved:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        agenda:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        groups:
          type: array
          items: { type: string }
        group_tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        identities:
          type: array
          items: { $ref: "#/components/schemas/Identity" }

    SavedFilter:
      type: object
      required: [slot, name, query]
      properties:
        id: { type: string }
        slot: { type: integer, minimum: 1, maximum: 9 }
        name: { type: string }
        query: { type: string }

    Event:
      type: object
      required: [seq, at, actor, kind, patch]
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string }
        actor:
          type: string
          description: "me, mcp:<name>, or plugin:<source>"
        task_id: { type: string }
        kind: { type: string }
        patch: { $ref: "#/components/schemas/Patch" }

    Patch:
      type: object
      properties:
        fields:
          type: object
          description: field name to its before and after value
          additionalProperties: { $ref: "#/components/schemas/Change" }
        undo_of:
          type: integer
          format: int64
          description: set on events of kind undo

    Change:
      type: object
      properties:
        from: {}
        to: {}

    UndoResult:
      type: object
      required: [reversed, kind]
      properties:
        reversed: { type: integer, format: int64 }
        kind: { type: string }
        task_id: { type: string }
        task: { $ref: "#/components/schemas/Task" }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: what a client branches on
        message:
          type: string
          description: what a human reads, saying what to do about it
        from: { $ref: "#/components/schemas/Status" }
        to: { $ref: "#/components/schemas/Status" }
