# `docker compose up` starts the server with a scratch database.
# `make seed` loads testdata/seed.json, including its fixed clock.

services:
  tdd:
    build:
      context: .
      args:
        VERSION: dev
    command:
      - "-addr"
      - "0.0.0.0:8080"
      - "-db"
      - "/data/td.db"
    ports:
      # Published to the host's loopback only. Change the host side with
      # TD_PORT=8099 docker compose up; the container side stays 8080.
      - "127.0.0.1:${TD_PORT:-8080}:8080"
    environment:
      TD_TIMEZONE: America/Chicago
      # The server refuses to start rather than guess its own public URL.
      # OAuth discovery, the ntfy click-through, and the resource claim all
      # depend on it, and a wrong guess fails like an application bug.
      TD_BASE_URL: ${TD_BASE_URL:-http://127.0.0.1:${TD_PORT:-8080}}
      # Behind a reverse proxy this must name the proxy, or every request
      # looks like it came from there and the per-IP login limit collapses
      # into one global limit.
      TD_TRUSTED_PROXIES: ${TD_TRUSTED_PROXIES:-}
      # Disposable dev topic, and only ever that one. Empty leaves reminders
      # off, which is the default: a server that has not been told where to
      # push does not guess.
      TD_NTFY_TOPIC: ${TD_NTFY_TOPIC:-}
    volumes:
      - td-data:/data
    restart: unless-stopped
    healthcheck:
      # distroless carries no shell and no curl, so the server checks itself.
      test: ["CMD", "/usr/local/bin/tdd", "-version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  td-data:
